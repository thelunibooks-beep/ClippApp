<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCOM - Mesa de Treball Local</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        :root { --primary: #003366; --accent: #28a745; --danger: #dc3545; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .wrapper { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        
        header { text-align: center; border-bottom: 2px solid var(--primary); margin-bottom: 30px; padding-bottom: 10px; }
        header h1 { margin: 0; color: var(--primary); font-size: 24px; }

        .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
        .panel { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        h2 { font-size: 16px; margin-top: 0; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        /* Dropzone */
        #drop-zone { border: 2px dashed var(--primary); padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; background: #f1f6ff; transition: 0.2s; }
        #drop-zone:hover { background: #e2ecf9; border-color: #0056b3; }

        /* Inputs */
        .input-box { display: flex; gap: 8px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,51,102,0.1); }

        /* List */
        .mesa-treball { border-top: 2px solid #eee; padding-top: 20px; }
        .item { display: flex; align-items: center; background: white; border: 1px solid #eee; padding: 12px; margin-bottom: 10px; border-radius: 6px; gap: 12px; transition: 0.2s; }
        .item:hover { border-color: #bbb; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tag { font-size: 10px; font-weight: bold; color: white; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; width: 60px; text-align: center; }
        .tag-digital { background: var(--accent); }
        .tag-pdf { background: #007bff; }
        .editable-title { flex-grow: 1; font-size: 14px; border: none; background: transparent; padding: 5px; }
        .editable-title:focus { background: #fffecb; outline: none; }

        /* Buttons */
        .btn { border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-del { background: none; color: var(--danger); font-size: 18px; padding: 0 10px; }
        .btn-del:hover { color: #a71d2a; }
        .btn-final { background: var(--accent); color: white; width: 100%; height: 55px; font-size: 18px; margin-top: 20px; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.2); }
        .btn-final:hover { background: #218838; transform: translateY(-1px); }

        /* Output */
        #email-box { background: #f1f3f5; border-left: 5px solid var(--primary); padding: 20px; margin-top: 25px; border-radius: 4px; display: none; }
        pre { white-space: pre-wrap; font-family: inherit; font-size: 14px; margin: 0; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>APPCLIP OCOM - Mesa de Treball V1.3</h1>
    </header>

    <div class="panels">
        <div class="panel">
            <h2>🌐 Diaris Digitals</h2>
            <div class="input-box">
                <input type="text" id="url-input" placeholder="Enganxa enllaç (TGN Digital, El Caso, etc.)">
                <button class="btn btn-add" onclick="afegirDigital()">+</button>
            </div>
        </div>

        <div class="panel">
            <h2>📰 Diari Paper (PDF)</h2>
            <div id="drop-zone" onclick="document.getElementById('file-input').click()">
                📂 Arrossega les pàgines seleccionades
                <input type="file" id="file-input" multiple accept="application/pdf" style="display:none" onchange="handlePdfs(this.files)">
            </div>
        </div>
    </div>

    <div class="mesa-treball">
        <h2>📝 Mesa de Treball (Edita o elimina)</h2>
        <div id="lista-unificada">
            <p id="empty-msg" style="text-align: center; color: #999; padding: 20px;">No hi ha notícies a la llista. Comença afegint un enllaç o un PDF.</p>
        </div>
    </div>

    <button class="btn btn-final" onclick="processarTot()">FINALITZAR CLIPPING</button>

    <div id="email-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <strong style="color: var(--primary);">📧 Text per al correu:</strong>
            <button class="btn btn-add" style="padding: 5px 10px; font-size: 12px;" onclick="copiarCorreu()">Copiar Text</button>
        </div>
        <pre id="email-content"></pre>
    </div>
</div>

<script>
    // Config de PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let mesa = [];

    function afegirDigital() {
        const input = document.getElementById('url-input');
        if (!input.value) return;
        
        let tit = input.value.split('/').pop().split('.')[0].replace(/-/g, ' ');
        tit = tit.charAt(0).toUpperCase() + tit.slice(1);
        
        mesa.push({ tipus: 'digital', titular: tit, link: input.value, fitxer: null });
        input.value = "";
        renderMesa();
    }

    async function handlePdfs(files) {
        for (let f of files) {
            const tit = await extraerTitular(f);
            mesa.push({ tipus: 'pdf', titular: tit, link: '(Adjunt al PDF)', fitxer: f });
        }
        renderMesa();
    }

    async function extraerTitular(file) {
        try {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
            const page = await pdf.getPage(1);
            const content = await page.getTextContent();
            
            // Filtramos líneas con texto real, ignorando ruidos comunes de cabeceras
            const lineas = content.items
                .map(i => i.str.trim())
                .filter(s => s.length > 15 && !s.includes('Pàgina') && !s.includes('2026'));

            return lineas.length > 0 ? lineas[0] : "Revisa el titular d'aquest PDF...";
        } catch (e) { return "Error llegint: " + file.name; }
    }

    function renderMesa() {
        const list = document.getElementById('lista-unificada');
        document.getElementById('empty-msg').style.display = mesa.length ? 'none' : 'block';
        
        list.innerHTML = "";
        mesa.forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = 'item';
            row.innerHTML = `
                <span class="tag ${item.tipus === 'digital' ? 'tag-digital' : 'tag-pdf'}">${item.tipus}</span>
                <input type="text" class="editable-title" value="${item.titular}" onchange="mesa[${idx}].titular = this.value">
                <button class="btn btn-del" onclick="mesa.splice(${idx},1); renderMesa()">×</button>
            `;
            list.appendChild(row);
        });
    }

    async function processarTot() {
        if (!mesa.length) return alert("Afegeix alguna cosa primer!");

        const { PDFDocument, rgb } = PDFLib;
        const outPdf = await PDFDocument.create();
        
        // Portada Simple
        const portada = outPdf.addPage([600, 800]);
        portada.drawText('CLIPPING DE PREMSA OCOM', { x: 50, y: 700, size: 24, color: rgb(0, 0.2, 0.4) });
        portada.drawText(new Date().toLocaleDateString('ca-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }), { x: 50, y: 670, size: 14 });

        // Unir PDFs
        for (let item of mesa) {
            if (item.tipus === 'pdf' && item.fitxer) {
                const bytes = await item.fitxer.arrayBuffer();
                const doc = await PDFDocument.load(bytes);
                const pages = await outPdf.copyPages(doc, doc.getPageIndices());
                pages.forEach(p => outPdf.addPage(p));
            }
        }

        // Descarga
        const pdfBytes = await outPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Clipping_OCOM_${new Date().toISOString().slice(0,10)}.pdf`;
        link.click();

        // Email
        let txt = "Bon dia,\n\nUs adjuntem el resum de premsa d'avui:\n\n";
        mesa.forEach(i => txt += `• ${i.titular}\n  ${i.link}\n\n`);
        txt += "Salutacions,\nEquip OCOM";
        
        document.getElementById('email-content').innerText = txt;
        document.getElementById('email-box').style.display = 'block';
    }

    function copiarCorreu() {
        const text = document.getElementById('email-content').innerText;
        navigator.clipboard.writeText(text);
        alert("Text copiat al porta-retalls!");
    }
</script>
</body>
</html>
