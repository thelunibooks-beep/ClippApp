<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Recull de premsa - Mossos RPCT V3.1</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #003366; --accent: #c60c30; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        header { text-align: center; border-bottom: 3px solid var(--primary); margin-bottom: 25px; }
        .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { border: 1px solid #e1e4e8; padding: 20px; border-radius: 10px; }
        #drop-zone { border: 2px dashed #cbd5e0; padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; background: #f8fafc; }
        #drop-zone:hover { border-color: var(--primary); background: #f0f4f8; }
        .loading { display: none; text-align: center; padding: 15px; background: #fff3cd; color: #856404; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
        .item { display: flex; align-items: center; background: #fff; border: 1px solid #edf2f7; padding: 10px; margin-bottom: 8px; border-radius: 8px; gap: 10px; }
        .tag { font-size: 10px; font-weight: bold; color: white; padding: 4px 8px; border-radius: 4px; min-width: 60px; text-align: center; }
        .editable-title { flex-grow: 1; border: none; font-size: 14px; outline: none; }
        .btn-final { background: var(--primary); color: white; width: 100%; padding: 15px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        #email-box { margin-top: 20px; padding: 20px; background: #2d3748; color: #fff; border-radius: 10px; white-space: pre-wrap; display: none; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>RECULL DE PREMSA - RPCT</h1></header>

    <div class="panels">
        <div class="panel">
            <h3>🌐 DIGITALS</h3>
            <input type="text" id="url-input" placeholder="Enganxa URL i prem Enter" onkeypress="if(event.key==='Enter') afegirDigital()" style="width:100%; padding:10px;">
        </div>
        <div class="panel">
            <h3>📰 PAPER (PDF)</h3>
            <div id="drop-zone" onclick="document.getElementById('file-input').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault(); handlePdfs(event.dataTransfer.files)">
                📂 Arrossega el PDF de 6 pàgines aquí
                <input type="file" id="file-input" multiple accept="application/pdf" style="display:none" onchange="handlePdfs(this.files)">
            </div>
        </div>
    </div>

    <div id="status" class="loading">⌛ L'IA està analitzant la portada... un moment si us plau.</div>
    <div id="lista-unificada"></div>
    <button class="btn-final" onclick="processarTot()">GENERAR CLIPPING FINAL</button>
    <div id="email-box"></div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkvI3VKMYUv6vdzkqxPaWexqXn9u6wbN1iLkarZzdJtOV0jrB7F3BADWln4XasdvVB/exec";
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    let mesa = [];

    function afegirDigital() {
        const input = document.getElementById('url-input');
        if (!input.value) return;
        mesa.push({ tipus: 'DIGITAL', titular: "Notícia digital", link: input.value, fitxer: null });
        input.value = "";
        renderMesa();
    }

    async function handlePdfs(files) {
        document.getElementById('status').style.display = 'block';
        for (let f of files) {
            try {
                const titulares = await extraerConIA(f);
                titulares.forEach(t => mesa.push({ tipus: 'PAPER', titular: t, link: '(Adjunt)', fitxer: f }));
            } catch (e) {
                mesa.push({ tipus: 'PAPER', titular: "Titular manual: " + f.name, link: '(Adjunt)', fitxer: f });
            }
        }
        document.getElementById('status').style.display = 'none';
        renderMesa();
    }

    async function extraerConIA(file) {
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
        const page = await pdf.getPage(1);
        
        const viewport = page.getViewport({scale: 1.5});
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({canvasContext: context, viewport: viewport}).promise;

        const base64Image = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

        // Petició optimitzada per evitar errors de lectura
        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'cors', 
            body: JSON.stringify({ image: base64Image }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });

        const json = await response.json();
        return json.success ? json.data : ["Fes clic per editar titular"];
    }

    function renderMesa() {
        const list = document.getElementById('lista-unificada');
        list.innerHTML = "";
        mesa.forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = 'item';
            row.innerHTML = `
                <span class="tag" style="background:${item.tipus==='DIGITAL'?'#28a745':'#007bff'}">${item.tipus}</span>
                <input type="text" class="editable-title" value="${item.titular}" onchange="mesa[${idx}].titular = this.value">
                <button onclick="mesa.splice(${idx},1); renderMesa()" style="border:none; background:none; cursor:pointer; color:red;">✕</button>
            `;
            list.appendChild(row);
        });
    }

    async function processarTot() {
        const { PDFDocument } = PDFLib;
        const finalPdf = await PDFDocument.create();
        const fitxersUnics = [...new Set(mesa.filter(i => i.fitxer).map(i => i.fitxer))];

        for (let f of fitxersUnics) {
            const donor = await PDFDocument.load(await f.arrayBuffer());
            const pages = await finalPdf.copyPages(donor, donor.getPageIndices());
            pages.forEach(p => finalPdf.addPage(p));
        }

        const pdfBytes = await finalPdf.save();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
        link.download = `Recull_OCOM.pdf`;
        link.click();

        let mail = "Bon dia,\n\nRecull de premsa:\n\n";
        mesa.forEach(i => mail += `• ${i.titular}\n  ${i.link}\n\n`);
        document.getElementById('email-box').innerText = mail;
        document.getElementById('email-box').style.display = 'block';
    }
</script>
</body>
</html>
